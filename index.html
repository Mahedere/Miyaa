<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miyaa Sweet Catering & Decor | Links</title>
    <meta name="description"
        content="Connect with Miyaa Sweet Catering & Decor for premium desserts, elegant sweet catering, and luxury event experiences.">

    <!-- No CDNs used. Relying on local styles and system font stacks for maximum performance and reliability. -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="background-overlay"></div>

    <main class="container">
        <header class="profile-section">
            <div class="logo-container">
                <img src="logo.jpg" alt="Miyaa Logo" class="brand-logo">
            </div>
            <h1 class="brand-name">Miyaa</h1>
            <p class="brand-tagline">Sweet Catering & Decor</p>
            <p class="brand-description">Premium desserts & refined celebration aesthetics for luxury events.</p>
        </header>

        <section id="links-container" class="links-section">
            <!-- Links will be injected here by JS -->
            <div class="loader">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
        </section>

        <footer class="footer">
            <div id="footer-socials" class="social-icons">
                <!-- Social icons injected by JS -->
            </div>
            <p>&copy; 2026 Miyaa Sweet Catering & Decor</p>
        </footer>
    </main>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>

</html>
